name: Build Flutter APK
# Trigger build on push or manual dispatch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Initialize Platform Files
        run: flutter create --project-name=nexus_connect .
        working-directory: flutter_app
          
      - name: Install Dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: flutter_app
        
      - name: Build APK
        run: flutter build apk --release
        working-directory: flutter_app
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
